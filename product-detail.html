<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Oyunverse — ürün detayı, özellikler ve fiyat bilgisi.">
    <meta name="keywords" content="oyuncu ekipmanları, gaming gear, ürün detay">
    <meta name="author" content="Senin adın">
    <meta name="robots" content="noindex,follow">

    <meta property="og:title" content="Ürün Detayı | OyunVerse">
    <meta property="og:description" content="Ürün özelliklerini ve fiyat bilgisini incele.">
    <meta property="og:image" content="assets/icons/header.jpg">
    <meta property="og:type" content="product">
    <meta property="og:locale" content="tr_TR">

    <meta name="theme-color" content="#0a0a12">

    <link rel="canonical" href="product-detail.html">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="icon" type="image/svg+xml" href="assets/icons/oyunverse-icon.svg">
    <link rel="apple-touch-icon" href="assets/icons/oyunverse-icon.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="stylesheet" href="css/base/_reset.css">
    <link rel="stylesheet" href="css/base/_variables.css">
    <link rel="stylesheet" href="css/layout/layout.css">
    <link rel="stylesheet" href="css/components/navbar.css">
    <link rel="stylesheet" href="css/components/buttons.css">
    <link rel="stylesheet" href="css/components/footer.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pages/product-detail.css">
    <link rel="stylesheet" href="css/responsive.css">

    <title>Ürün Detayı | Oyunverse</title>
</head>
<body>
    <header id="header">
        <a href="index.html">
            <img src="assets/icons/oyunverse-wordmark.svg" alt="OyunVerse">
        </a>

        <button id="menu-toggle" class="menu-toggle">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav id="navbar">
            <ul class="nav-list" id="nav-list">
                <li><a href="index.html">Ana Sayfa</a></li>
                <li><a href="tournaments.html">Turnuvalar</a></li>
                <li><a href="news.html">Haberler</a></li>
                <li><a href="shop.html" class="active">Mağaza</a></li>
                <li><a href="plans.html">Planlar</a></li>
            </ul>
        </nav>

        <div class="navbar-actions">
            <button class="icon-btn" aria-label="Search">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </button>

            <a href="cart.html" class="icon-btn" aria-label="Cart">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="9" cy="21" r="1"></circle>
                    <circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
            </a>

            <button class="btn-signin">Giriş Yap</button>
        </div>
    </header>

    <main id="main" class="main">
        <section class="product-detail">

            <a href="shop.html" class="back-link">&larr; Mağazaya Dön</a>

            <div class="product-detail-layout">
                <div class="product-detail-media">
                    <img id="detail-image" src="" alt="">
                    <span class="product-badge" id="detail-badge"></span>
                </div>

                <div class="product-detail-info">
                    <span class="product-category-tag" id="detail-category"></span>
                    <h1 id="detail-name"></h1>
                    <span class="detail-brand" id="detail-brand"></span>

                    <div class="detail-price-row">
                        <span class="detail-price" id="detail-price"></span>
                        <span class="detail-old-price" id="detail-old-price"></span>
                    </div>

                    <p id="detail-description"></p>

                    <div class="quantity-row">
                        <label for="detail-quantity">Adet</label>
                        <div class="quantity-control">
                            <button type="button" class="quantity-btn" id="quantity-decrease">&minus;</button>
                            <input type="number" id="detail-quantity" value="1" min="1">
                            <button type="button" class="quantity-btn" id="quantity-increase">&plus;</button>
                        </div>
                    </div>

                    <button class="cta-btn" id="add-to-cart-btn">Sepete Ekle</button>
                    <p class="cart-success" id="cart-success">Ürün sepete eklendi!</p>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="footer-top">
            <div class="footer-brand">
                <h3 class="footer-logo">Oyunverse</h3>
                <p class="footer-tagline">Compete. Connect. Conquer.</p>
            </div>

            <div class="footer-links">
                <h4>Keşfet</h4>
                <ul>
                    <li><a href="tournaments.html">Turnuvalar</a></li>
                    <li><a href="news.html">Haberler</a></li>
                    <li><a href="shop.html">Mağaza</a></li>
                </ul>
            </div>

            <div class="footer-links">
                <h4>Kurumsal</h4>
                <ul>
                    <li><a href="about.html">Hakkımızda</a></li>
                    <li><a href="contact.html">İletişim</a></li>
                </ul>
            </div>

            <div class="footer-social">
                <h4>Bizi Takip Et</h4>
                <div class="footer-social-icons">
                    <a href="#" class="icon-btn"><i class="bi bi-twitter-x"></i></a>
                    <a href="#" class="icon-btn"><i class="bi bi-instagram"></i></a>
                    <a href="#" class="icon-btn"><i class="bi bi-youtube"></i></a>
                </div>
            </div>
        </div>

        <div class="footer-bottom">
            <p>&copy; 2026 Oyunverse. Tüm hakları saklıdır.</p>
        </div>
    </footer>

    <script src="js/core/main.js"></script>
    <script src="js/data/productsData.js"></script>
    <script src="js/pages/product-detail.js"></script>
</body>
</html>
