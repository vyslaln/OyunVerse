<!DOCTYPE html>
<html lang="tr">
<head>
    <!-- Meta & SEO & Open Graph & Title -->
    
    <!-- Meta  -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO -->
    <meta name="description" content="Oyunverse — e-spor turnuvaları, oyun haberleri/incelemeleri, gaming ekipman mağazası ve cloud gaming abonelikleri tek platformda.">
    <meta name="keywords" content="esports, gaming, tournaments, gaming gear, cloud gaming, oyun haberleri">
    <meta name="author" content="Senin adın">
    <meta name="robots" content="index,follow">

    <!-- Open Graph -->
    <meta property="og:title" content="OyunVerse">
    <meta property="og:description" content="Compete. Connect. Conquer. — Bir e-spor & gaming platformu.">
    <meta property="og:image" content="assets/icons/header.jpg">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="tr_TR">

    <!-- Tarayıcı Tema Rengi -->
    <meta name="theme-color" content="#0a0a12">

    <!-- Canonical Link (sayfanın "asıl" adresi) -->
    <link rel="canonical" href="index.html">

    <!-- Fontlar -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/icons/oyunverse-icon.svg">
    <link rel="apple-touch-icon" href="assets/icons/oyunverse-icon.png">

    <!-- Harici (External) CSS Dosyaları -->
    <link rel="stylesheet" href="css/base/_reset.css">
    <link rel="stylesheet" href="css/base/_variables.css">
    <link rel="stylesheet" href="css/layout/layout.css">
    <link rel="stylesheet" href="css/components/navbar.css">
    <link rel="stylesheet" href="css/components/news-card.css">
    <link rel="stylesheet" href="css/components/buttons.css">
    <link rel="stylesheet" href="css/components/footer.css">
    <link rel="stylesheet" href="css/components/product-card.css">
    <link rel="stylesheet" href="css/components/tournament-card.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pages/home.css">
    <link rel="stylesheet" href="css/responsive.css">


    <!-- Title -->
    <title>Oyunverse | Esports Tournaments, News & Gaming Gear</title>
    
</head>
<body>
    <!-- Header & Navbar -->
    <header id="header">
        <a href="index.html">
            <img src="assets/icons/oyunverse-wordmark.svg" alt="OyunVerse">
        </a>

        <!-- Mobil Cihazlar İçin Hamburger Menü -->
        <button id="menu-toggle" class="menu-toggle">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <!-- Navbar -->
        <nav id="navbar">
            <ul class="nav-list" id="nav-list">
                <li><a href="index.html">Ana Sayfa</a></li>
                <li><a href="tournaments.html">Turnuvalar</a></li>
                <li><a href="news.html">Haberler</a></li>
                <li><a href="shop.html">Mağaza</a></li>
                <li><a href="plans.html">Planlar</a></li>

            </ul>
        </nav>

        <!-- Sepet ikonu, arama butonu ikonu ve giriş yap butonu -->
        <div class="navbar-actions">

            <button class="icon-btn" aria-label="Search">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </button>

            <button class="icon-btn" aria-label="Cart">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="9" cy="21" r="1"></circle>
                    <circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
            </button>

            <button class="btn-signin">Giriş Yap</button>
        </div>
    </header>

    <!-- Main -->
    <main id="main" class="main">
        
        <!-- Hero -->
        <section id="hero" class="hero">

            <div class="hero-actions">
                <div class="hero-top">
                    <img src="https://images.unsplash.com/photo-1767455471543-055dbc6c6700?w=1920&q=80" alt="Takım logolu banner'ların asılı olduğu bir e-spor etkinliği">
                    <div class="hero-text-block">
                        <p class="hero-text" id="hero-text">COMPETE. CONNECT. CONQUER.</p>
                        <h1 class="hero-title" id="hero-title">Türkiye'nin <br>
                            E-spor <br>
                            ve <br>
                            Oyun Platformu.</h1>
                        <h2 class="hero-text1" id="hero-text1">Turnuvalara katıl, <br>
                            en güncel oyun haberlerini takip et, <br>
                            ekipmanını yenile ve cloud gaming ile her yerden oyna.</h2>
                        <a href="plans.html" id="plans-cta-btn" class="cta-btn">
                            Planlara Göz At!
                        </a>
                    </div>
                </div>

                <div class="hero-cards-row">
                    <div class="hero-card">
                        <img src="https://images.unsplash.com/photo-1633545505446-586bf83717f0?w=1600&q=80" alt="Yan yana dizilmiş çoklu monitörlerin bulunduğu bir e-spor arenası">

                        <a id="trnmnt-cta-btn" class="cta-btn" href="tournaments.html">
                            Turnuvalara Katıl!
                        </a>
                    </div>

                    <div class="hero-card">
                        <img src="https://images.unsplash.com/photo-1636489953081-c4ebbd50fa3a?w=1600&q=80" alt="Monitör, klavye ve mouse'tan oluşan bir gaming kurulumu">

                        <a id="shop-cta-btn" class="cta-btn" href="shop.html">
                            Mağazayı Keşfet!
                        </a>
                    </div>  
                </div>
            </div>
        </section>

        <!-- Haberler -->
        <section id="news-section" class="news-section">

            <div class="news-tabs">
                <button class="news-btn active" id="tournament-news-btn" data-tab="turnuva">
                    Turnuva Haberleri
                </button>

                <button class="news-btn" id="game-news-btn" data-tab="oyun">
                    Oyun Haberleri
                </button>

                <button class="news-btn" id="campain-news-btn" data-tab="kampanya">
                    Kampanya
                </button>
            </div>

            <div class="news-panels">
                <template id="news-card-template">
                        <div class="news-card">
                            <a href=""><img src="" alt=""></a>
                            <span class="badge-title"></span>
                            <h3></h3>
                            <p></p>
                            <span class="date"></span>
                        </div>
                    </template> 
                <div class="news-panel active" data-panel="turnuva">
                    <button class="left-arrow">
                        ←
                    </button>

                    <div class="news-card-track">

                    </div>

                    <button class="right-arrow">
                        →
                    </button>
                </div>

                <div class="news-panel" data-panel="oyun">
                    <button class="left-arrow">
                        ←
                    </button>
                    
                    <div class="news-card-track">

                    </div>

                    <button class="right-arrow">
                        →
                    </button>
                </div>

                <div class="news-panel" data-panel="kampanya">
                    <button class="left-arrow">
                        ←
                    </button>
                    
                    <div class="news-card-track">

                    </div>

                    <button class="right-arrow">
                        →
                    </button>
                </div>
            </div>
        </section>
    </main>


    <!-- Harici (external) js dosyaları  -->
    <script src="js/core/main.js"></script>
    <script src="js/data/newsData.js"></script>
    <script src="js/pages/home.js"></script>
</body>
</html>
